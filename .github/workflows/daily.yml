name: daily-pipeline

on:
  # Cron desligado até a Fase 5 (o pipeline ainda não existe). Para religar:
  # schedule:
  #   - cron: "0 9 * * *"   # 06:00 em Brasília (UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          NOMINATIM_USER_AGENT: ${{ secrets.NOMINATIM_USER_AGENT }}
        run: python -m pipeline.run
      - name: Commit aggregates
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet || (git commit -m "chore: atualiza agregados" && git push)
